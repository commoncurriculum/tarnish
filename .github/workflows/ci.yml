name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  # ProseMirror's own test suites, unedited: first against the real packages, to show the
  # suites and the harness are sound, then against tarnish.
  upstream-suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [js, rust]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target == 'rust'
      - uses: Swatinem/rust-cache@v2
        if: matrix.target == 'rust'
      - run: npm ci
      # The suites are the submodules' own tests, so they must be of the versions installed.
      - name: Check the suites are the installed packages' own
        run: |
          for package in prosemirror-model prosemirror-transform; do
            test "$(git -C upstream/$package describe --tags)" = \
              "$(node -p "require('$package/package.json').version")"
          done
      - run: npm run test:${{ matrix.target }}
      # The run against the real packages records the fixtures again. The Rust, Elixir and C
      # tests, and tarnish-html's, expect what it records, so it must be exactly what JavaScript
      # writes today, and no fixture may be left untracked.
      - run: git diff --exit-code fixtures && test -z "$(git status --porcelain fixtures)"
        if: matrix.target == 'js'

  # tarnish-markdown's rules.rs is generated from marked, so it must be what the installed marked
  # builds.
  marked-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - name: Check marked's rules are current
        shell: bash
        run: npx tsx crates/tarnish-markdown/tools/marked_rules.ts | rustfmt --edition 2024 | diff - crates/tarnish-markdown/src/marked/rules.rs

  elixir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "25.3.2.21"
          elixir-version: "1.17.3"
      # The tests' application converts on the harness's ProseMirror and linkedom in its workers.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: mix deps.get
      - run: mix format --check-formatted
      # Builds the tests' NIF, which holds tarnish's functions in place of Tarnish.Native, and
      # runs Tarnish.Bridge's tests on the Node workers and on that NIF.
      - run: mix test
      - name: Load Tarnish.Native, which the tests replace
        run: mix run -e '{:ok, _} = Tarnish.Schema.new(%{"nodes" => [{"doc", %{"content" => "text*"}}, {"text", %{}}]})'
        env:
          MIX_ENV: dev

  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the header declares the library as it is
        run: |
          cargo run -p tarnish-c --example header --features headers
          git diff --exit-code crates/tarnish-c/include
      - run: npm run test:c

  # On musl, a library loaded after the program starts can't have initial-exec thread-locals, so
  # the NIF and the C library are loaded that way on Alpine, as the Elixir image loads the NIF.
  musl:
    runs-on: ubuntu-latest
    container: hexpm/elixir:1.17.3-erlang-25.3.2.21-alpine-3.22.5
    env:
      MIX_ENV: test
      # Rust links a program statically on musl, which a library can't be.
      RUSTFLAGS: -C target-feature=-crt-static
    steps:
      # stylo's build script, which the tests' NIF builds, runs Python.
      - run: apk add --no-cache bash build-base curl git python3
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Load the NIF and run the Elixir tests
        working-directory: elixir
        run: mix local.hex --force && mix local.rebar --force && mix deps.get && mix test --exclude bridge
      - name: Load the C library with dlopen
        run: |
          cargo build --release -p tarnish-c
          cc -std=c11 -Wall -Wextra -Werror -I crates/tarnish-c/include \
            crates/tarnish-c/tests/load.c -o target/load
          target/load target/release/libtarnish_c.so
