name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # ProseMirror's own test suites, unedited: first against the real packages, to show the
  # suites and the harness are sound, then against tarnish.
  upstream-suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [js, rust]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target == 'rust'
      - uses: Swatinem/rust-cache@v2
        if: matrix.target == 'rust'
      - run: npm ci
      - run: npm run test:${{ matrix.target }}
