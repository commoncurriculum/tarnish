[package]
name = "tarnish_test_native"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The NIF of the application tarnish's Elixir tests make, which Tarnish.TestNative loads."

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
rustler = "0.38"
tarnish = { path = "../../../../crates/tarnish" }
tarnish-html = { path = "../../../../crates/tarnish-html" }
tarnish-nif = { path = "../../../../crates/tarnish-nif" }
