[package]
name = "tarnish-css"
version = "0.1.0"
description = "A CSS declaration block, as element.style holds one, on stylo, Servo's CSS engine"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Pinned exactly: the linkedom fork runs this crate as WebAssembly built from tarnish's lockfile,
# and a crate that depends on this one must resolve the same engine. `ENGINE` names it.
[dependencies]
cssparser = "=0.37.0"
stylo = "=0.21.0"
stylo_static_prefs = "=0.21.0"
stylo_traits = "=0.21.0"
url = "2"

# WebAssembly's call stack is the engine's, which no new segment can extend.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tarnish-js = { path = "../tarnish-js", version = "0.1.0" }
