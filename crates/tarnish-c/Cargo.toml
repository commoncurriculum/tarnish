[package]
name = "tarnish-c"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "tarnish as a C library: ProseMirror's JSON in and out, for any language with a C FFI."

[lib]
name = "tarnish_c"
crate-type = ["cdylib", "staticlib"]
test = false
doctest = false

[dependencies]
tarnish = { path = "../tarnish" }
