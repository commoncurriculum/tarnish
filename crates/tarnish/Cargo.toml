[package]
name = "tarnish"
version = "0.1.0"
description = "ProseMirror's document model and transforms"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
memchr = "2"
rustc-hash = "2"
# JSON text laid out as one flat tape, which a document is read from without a JSON value of
# the whole of it.
simd-json = { version = "0.17", default-features = false, features = ["runtime-detection", "swar-number-parsing"] }
tarnish-js = { path = "../tarnish-js", version = "0.1.0" }

[dev-dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["v2"] }
tarnish-fixtures = { path = "../tarnish-fixtures" }
# RegExp, for the tests that hold hand-written scanners to the regexes they port.
tarnish-js = { path = "../tarnish-js", version = "0.1.0", features = ["regexp"] }
