[package]
name = "tarnish"
version = "0.1.0"
description = "ProseMirror's document model and transforms"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rustc-hash = "2"
tarnish-js = { path = "../tarnish-js", version = "0.1.0" }

[dev-dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["v2"] }
tarnish-fixtures = { path = "../tarnish-fixtures" }
