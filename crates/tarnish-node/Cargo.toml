[package]
name = "tarnish-node"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The Node.js bridge that runs ProseMirror's own tests against tarnish. Internal; not published."

[lib]
crate-type = ["cdylib"]
# The bridge's tests are ProseMirror's suites, run from Node; napi registers nothing in a Rust
# test build.
test = false
doctest = false

[dependencies]
napi = { version = "3", default-features = false, features = ["napi9"] }
napi-derive = "3"
tarnish = { path = "../tarnish" }

[build-dependencies]
napi-build = "2"
