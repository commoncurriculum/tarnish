[package]
name = "tarnish-html"
version = "0.1.0"
description = "An HTML DOM for tarnish's DomParser and DomSerializer: parse and write HTML as the standard does"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cssparser = "0.37"
html5ever = "0.40"
html5gum = { version = "0.8", default-features = false }
memchr = "2"
precomputed-hash = "0.1"
rustc-hash = "2"
selectors = "0.40"
tarnish = { path = "../tarnish", version = "0.1.0" }
tarnish-css = { path = "../tarnish-css", version = "0.1.0" }
url = "2"
