[package]
name = "tarnish_elixir"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The Elixir binding of tarnish: tarnish-nif's ProseMirror functions as the NIF Tarnish.Native loads."

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["v2"] }
rustler = "0.38"
tarnish-nif = { path = "../tarnish-nif" }
